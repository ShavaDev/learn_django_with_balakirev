{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ title }}</title>
<!--    <link type="text/css" href="{% static 'hardware/css/styles.css' %}" rel="stylesheet" />-->
    <link rel="stylesheet" href="{% static 'hardware/css/styles.css' %}">
</head>
<body>
<ul>
    <li>
        <a href="{% url 'home' %}">Главная страница</a>
    </li>
    {% for m in menu %}
    {% if not forloop.last %}
    <li>
        <a href="{% url m.url_name %}">{{ m.title }}</a>
    </li>
    {% else %}
    <li class="last">
        <a href="{% url m.url_name %}">{{ m.title }}</a>
    </li>
    {% endif %}
    {% endfor %}
</ul>

{% block content %} {% endblock %}
</body>
</html>
